schema_version = "1.3"
artifacts = [
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/collection.ready", service = "sim" },
  { source = "/data/sim-hostname.txt", service = "sim" },
]

[task]
name = "game-exam/overcooked-isolation"
description = "Exercise one public action and collect the sealed Overcooked development episode."

[metadata]
protocol = "game-standard/2.2"

[agent]
user = "65534"
timeout_sec = 240

[verifier]
environment_mode = "separate"
network_mode = "no-network"
timeout_sec = 60

[[verifier.collect]]
service = "sim"
command = """
set -eu
test ! -e /logs/verifier
test ! -e /logs/artifacts
kill -USR1 "$(cat /data/server.pid)"
i=0
while [ ! -f /data/collection.ready ] && [ "$i" -lt 30 ]; do sleep 1; i=$((i+1)); done
test -f /data/collection.ready && test -s /data/final.json && hostname > /data/sim-hostname.txt
"""
timeout_sec = 40
