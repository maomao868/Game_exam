schema_version = "1.3"
artifacts = [{ source = "/evidence", service = "sim" }]

[task]
name = "game-exam/ORDER_SLUG"
description = "Collab-Overcooked native two-role episode group"

[metadata]
protocol = "collab-overcooked/native"
source_commit = "REVISION"
model = "MODEL_NAME"
episodes = EPISODES
policy = "POLICY"

[agent]
user = "65534"
timeout_sec = TRIAL_TIMEOUT

[verifier]
environment_mode = "separate"
network_mode = "no-network"
timeout_sec = 300

[[verifier.collect]]
service = "sim"
command = "test \"$(cat /status/state)\" = complete && test ! -e /logs/verifier && test ! -e /run/secrets/model_key && test ! -d /bench/src/prompts/reference"
