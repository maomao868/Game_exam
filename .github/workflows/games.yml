name: games
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: games-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python ci_checks/check-games.py
  adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        benchmark: [common, minigrid, crafter, textworld, babaisai, minihack, towermind]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: docker build -f game_first_exam/tests/envs/${{ matrix.benchmark }}.Dockerfile -t game-tests:${{ matrix.benchmark }} .
      - if: matrix.benchmark != 'towermind'
        run: docker run --rm -v "$PWD:/repo:ro" game-tests:${{ matrix.benchmark }} bash game_first_exam/tests/run.sh ${{ matrix.benchmark }}
      - if: matrix.benchmark == 'towermind'
        run: docker run --rm --network none -v "$PWD:/repo:ro" game-tests:towermind bash game_first_exam/tests/run.sh towermind
      - if: matrix.benchmark == 'towermind'
        name: Check TowerMind sandbox boundary from a separate container
        run: |
          docker build --target client -f game_first_exam/tests/envs/towermind.Dockerfile -t game-tests:towermind-client .
          bash game_first_exam/tests/check-towermind-network.sh
      - if: ${{ failure() && matrix.benchmark == 'towermind' }}
        name: Check the official Windows player under Wine
        run: |
          docker build --target windows-probe -f game_first_exam/tests/envs/towermind.Dockerfile -t game-tests:towermind-wine .
          docker run --rm --init --network none -v "$PWD:/repo:ro" game-tests:towermind-wine \
            xvfb-run -a -s "-screen 0 1400x900x24" python game_first_exam/tests/towermind_windows_probe.py
  harbor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e .
      - run: harbor run --game-suite minihack-balrog --standard --list
      - run: python game_first_exam/tests/test_game_harbor.py
  fresh-clone-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      # A separate daemon has no game images from adapter jobs or developer machines.
      # Locally assembled files-only images must resolve by their pinned OCI digest.
      - uses: docker/setup-docker-action@v5
        with:
          version: v29.5.2
          set-host: true
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - run: python -m pip install -e .
      - name: Run the README example without model or registry credentials
        run: |
          harbor run --game-suite minihack --standard --family room \
            -c configs/harbor/oracle.json --plugin game_harbor:GameRecords \
            --jobs-dir "$PWD/jobs" --job-name fresh-clone-room -y
      - name: Check native result, collection, provenance and recording
        run: python ci_checks/check-smoke-result.py jobs/fresh-clone-room
      - name: Decode the complete replay
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -v error -i jobs/fresh-clone-room/*/artifacts/data/replay.mp4 -f null -
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-clone-room-evidence
          path: jobs/
          retention-days: 7
  invariants:
    needs: [static, adapters, harbor, fresh-clone-smoke]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          STATIC: ${{ needs.static.result }}
          ADAPTERS: ${{ needs.adapters.result }}
          HARBOR: ${{ needs.harbor.result }}
          SMOKE: ${{ needs.fresh-clone-smoke.result }}
        run: test "$STATIC" = success && test "$ADAPTERS" = success && test "$HARBOR" = success && test "$SMOKE" = success
