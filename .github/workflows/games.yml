name: games
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: games-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python ci_checks/check-games.py
  adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        benchmark: [common, minigrid, crafter, textworld, babaisai, minihack, overcooked]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: docker build -f game_first_exam/tests/envs/${{ matrix.benchmark }}.Dockerfile -t game-tests:${{ matrix.benchmark }} .
      - run: docker run --rm ${{ matrix.benchmark == 'overcooked' && '--network none' || '' }} -v "$PWD:/repo:ro" game-tests:${{ matrix.benchmark }} bash game_first_exam/tests/run.sh ${{ matrix.benchmark }}
      - if: matrix.benchmark == 'overcooked'
        name: Verify the isolated kitchen client and simulator
        run: |
          docker build --target client -f game_first_exam/tests/envs/overcooked.Dockerfile -t game-tests:overcooked-client .
          bash game_first_exam/tests/check-overcooked-network.sh
      - if: matrix.benchmark == 'overcooked'
        uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - if: matrix.benchmark == 'overcooked'
        name: Run and verify a separate Harbor verifier for Overcooked
        run: |
          python -m pip install -e .
          harbor run -p game_first_exam/tests/fixtures/overcooked-isolation \
            -c configs/harbor/oracle.json --jobs-dir "$PWD/jobs" --job-name overcooked-isolation -y
          python ci_checks/check-overcooked-isolation.py jobs/overcooked-isolation
      - if: always() && matrix.benchmark == 'overcooked'
        uses: actions/upload-artifact@v4
        with:
          name: overcooked-harbor-isolation
          path: jobs/overcooked-isolation/
          retention-days: 7
  harbor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e .
      - run: harbor run --game-suite minihack-balrog --standard --list
      - run: python game_first_exam/tests/test_game_harbor.py
  collab-overcooked:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/checkout@v4
        with:
          repository: YusaeMeow/Collab-Overcooked
          ref: d7ae1aa5e63d8ec076e96ee437fcbbd095278ef4
          path: .local/reference
          persist-credentials: false
      - run: python -m pip install -e .
      - run: harbor run --game-suite collab-overcooked --offline-smoke --job-name collab-smoke -y
      - run: python ci_checks/check-collab-overcooked.py jobs/collab-smoke .local/reference
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collab-overcooked-harbor
          path: jobs/
          retention-days: 7
  fresh-clone-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      # A separate daemon has no game images from adapter jobs or developer machines.
      # Locally assembled files-only images must resolve by their pinned OCI digest.
      - uses: docker/setup-docker-action@v5
        with:
          version: v29.5.2
          set-host: true
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - run: python -m pip install -e .
      - name: Run the README example without model or registry credentials
        run: |
          harbor run --game-suite minihack --standard --family room \
            -c configs/harbor/oracle.json --plugin game_harbor:GameRecords \
            --jobs-dir "$PWD/jobs" --job-name fresh-clone-room -y
      - name: Check native result, collection, provenance and recording
        run: python ci_checks/check-smoke-result.py jobs/fresh-clone-room
      - name: Decode the complete replay
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -v error -i jobs/fresh-clone-room/*/artifacts/data/replay.mp4 -f null -
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-clone-room-evidence
          path: jobs/
          retention-days: 7
  invariants:
    needs: [static, adapters, harbor, fresh-clone-smoke, collab-overcooked]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          STATIC: ${{ needs.static.result }}
          ADAPTERS: ${{ needs.adapters.result }}
          HARBOR: ${{ needs.harbor.result }}
          SMOKE: ${{ needs.fresh-clone-smoke.result }}
          COLLAB: ${{ needs.collab-overcooked.result }}
        run: test "$STATIC" = success && test "$ADAPTERS" = success && test "$HARBOR" = success && test "$SMOKE" = success && test "$COLLAB" = success
